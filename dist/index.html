<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iBouncy - LeaferJS 弹球游戏</title>
    <meta name="description" content="iBouncy 是一款基于 LeaferJS Canvas 引擎的弹球游戏，考验你的反应力和精准度。支持在线排行榜、云端同步成绩。">
    <meta property="og:title" content="iBouncy - LeaferJS 弹球游戏">
    <meta property="og:description" content="基于 LeaferJS Canvas 引擎的弹球游戏，支持在线排行榜与云端同步。">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preload" href="/fonts/HYDiSiKe-U.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        * {
            user-select: none;
            -webkit-user-drag: none;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: linear-gradient(
                160deg,
                #0D0D1B 0%,
                #111128 25%,
                #0E0E22 50%,
                #0A0A1E 75%,
                #0D0D20 100%
            );
        }

        canvas {
            position: fixed;
            width: 100vw;
            height: 100vh;
        }

        #loading {
            position: fixed;
            transform: translate(calc(50vw - 117px), calc(50vh - 50px)) scale(1.2);
        }

        /* ============================================
           Cloud UI - Liquid Glass Design System
           (iOS 26 inspired: translucency, dynamic light,
            soft gradients, spatial depth, iridescence)
           ============================================ */

        /* -----------------------------------------------
           Liquid Glass Global Properties / Root Setup
           ----------------------------------------------- */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-bg-hover: rgba(255, 255, 255, 0.11);
            --glass-bg-active: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-border-focus: rgba(180, 180, 255, 0.35);
            --glass-blur: saturate(200%) blur(40px);
            --glass-blur-light: saturate(180%) blur(24px);
            --glass-blur-heavy: saturate(220%) blur(60px);
            --glass-highlight: inset 0 0.5px 0 rgba(255,255,255,0.18);
            --glass-edge: inset 0 0 0 0.5px rgba(255,255,255,0.1);
            --depth-near: 0 4px 24px rgba(0,0,0,0.35);
            --depth-mid: 0 12px 48px rgba(0,0,0,0.45);
            --depth-far: 0 24px 80px rgba(0,0,0,0.55);
            --accent-1: #9B9BFF;
            --accent-2: #B8A9FF;
            --accent-3: #C5B8FF;
            --accent-cyan: #7EE8D0;
            --accent-rose: #FFB3B8;
            --accent-gold: #F5D78C;
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 16px;
            --radius-sm: 14px;
            --radius-full: 999px;
        }

        #cloud-ui-root {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", ui-sans-serif, system-ui, "Helvetica Neue", Arial, sans-serif;
            user-select: text;
            -webkit-font-smoothing: antialiased;
        }

        #cloud-ui-root * {
            user-select: text;
            -webkit-user-drag: none;
        }

        /* -----------------------------------------------
           Floating Action Button (FAB) - Liquid Glass Pill
           ----------------------------------------------- */
        #cloud-ui-root .cloud-fab {
            position: absolute;
            top: 14px;
            right: 14px;
            display: flex;
            gap: 8px;
            align-items: center;
            pointer-events: auto;
            transform-origin: top right;
            opacity: 1;
            transform: scale(1) translateZ(0);
            filter: blur(0);
            transition:
                opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                filter 0.38s ease;
            perspective: 800px;
        }

        #cloud-ui-root .cloud-fab.cloud-fab--game-hidden {
            opacity: 0;
            transform: scale(0.58) translateY(8px);
            pointer-events: none;
            filter: blur(3px);
            transition:
                opacity 0.32s cubic-bezier(0.4, 0, 0.55, 1),
                transform 0.32s cubic-bezier(0.4, 0, 0.55, 1),
                filter 0.28s ease;
        }

        /* FAB Pill - Main glass container */
        #cloud-ui-root .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 6px 6px 14px;
            border-radius: var(--radius-full);
            color: rgba(255, 255, 255, 0.93);
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: var(--depth-near),
                        var(--glass-highlight),
                        inset 0 -1px 0 rgba(0,0,0,0.06);
            animation: pillFloat 6s ease-in-out infinite, pillIridesce 8s ease-in-out infinite;
            transform-style: preserve-3d;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.35s ease;
        }

        #cloud-ui-root .pill:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: var(--depth-mid),
                        var(--glass-highlight),
                        0 0 40px rgba(155,155,255,0.15),
                        inset 0 -1px 0 rgba(0,0,0,0.06);
        }

        /* Floating / breathing animation */
        @keyframes pillFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        /* Iridescent edge glow animation */
        @keyframes pillIridesce {
            0%, 100% {
                border-color: rgba(180,180,255,0.18);
                box-shadow: var(--depth-near), var(--glass-highlight);
            }
            33% {
                border-color: rgba(180,200,255,0.25);
                box-shadow: var(--depth-near), var(--glass-highlight),
                            0 0 28px rgba(155,155,255,0.08);
            }
            66% {
                border-color: rgba(200,170,255,0.22);
                box-shadow: var(--depth-near), var(--glass-highlight),
                            0 0 28px rgba(180,160,255,0.06);
            }
        }

        /* Button reset */
        #cloud-ui-root button {
            appearance: none;
            border: 0;
            cursor: pointer;
            font: inherit;
            position: relative;
            overflow: hidden;
            outline: none;
        }

        /* -----------------------------------------------
           Buttons - Liquid Glass
           ----------------------------------------------- */
        #cloud-ui-root .btn {
            border-radius: var(--radius-full);
            padding: 8px 14px;
            color: rgba(255, 255, 255, 0.92);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: var(--glass-blur-light);
            -webkit-backdrop-filter: var(--glass-blur-light);
            box-shadow: 0 2px 12px rgba(0,0,0,0.18),
                        var(--glass-highlight);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            font-weight: 520;
            font-size: 12.5px;
            letter-spacing: 0.15px;
            transform: translateZ(0);
        }

        #cloud-ui-root .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(
                135deg,
                rgba(255,255,255,0.2) 0%,
                transparent 50%,
                rgba(155,155,255,0.1) 100%
            );
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }

        #cloud-ui-root .btn:hover {
            transform: translateY(-2px) scale(1.02);
            background: rgba(255, 255, 255, 0.13);
            border-color: rgba(180,180,255,0.3);
            box-shadow: 0 6px 24px rgba(0,0,0,0.25),
                        0 0 20px rgba(155,155,255,0.1),
                        var(--glass-highlight);
        }

        #cloud-ui-root .btn:hover::before {
            opacity: 1;
        }

        #cloud-ui-root .btn:active {
            transform: translateY(0) scale(0.97);
            background: rgba(255, 255, 255, 0.16);
            transition: transform 0.08s ease, background 0.15s ease;
        }

        /* Glass ripple */
        #cloud-ui-root .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(255,255,255,0.5) 0%,
                rgba(200,200,255,0.2) 40%,
                transparent 70%
            );
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease, opacity 0.5s ease;
            opacity: 0;
            pointer-events: none;
        }

        #cloud-ui-root .btn:active::after {
            width: 250%;
            height: 250%;
            opacity: 1;
            transition: width 0s, height 0s, opacity 0.3s ease;
        }

        /* Primary button - iridescent glass */
        #cloud-ui-root .btn.primary {
            background: linear-gradient(
                135deg,
                rgba(140,140,255,0.5) 0%,
                rgba(160,140,240,0.4) 40%,
                rgba(180,160,255,0.3) 100%
            );
            border-color: rgba(180,180,255,0.35);
            box-shadow: 0 4px 20px rgba(140,130,255,0.25),
                        0 0 0 1px rgba(200,200,255,0.08),
                        var(--glass-highlight);
        }

        #cloud-ui-root .btn.primary:hover {
            background: linear-gradient(
                135deg,
                rgba(150,150,255,0.6) 0%,
                rgba(170,150,255,0.5) 40%,
                rgba(180,170,255,0.4) 100%
            );
            border-color: rgba(200,180,255,0.5);
            box-shadow: 0 8px 32px rgba(140,130,255,0.35),
                        0 0 0 1px rgba(200,200,255,0.12),
                        var(--glass-highlight);
        }

        /* Danger button */
        #cloud-ui-root .btn.danger {
            background: linear-gradient(
                135deg,
                rgba(255,140,140,0.35) 0%,
                rgba(240,130,130,0.25) 100%
            );
            border-color: rgba(255,160,160,0.3);
        }

        #cloud-ui-root .btn.danger:hover {
            background: linear-gradient(
                135deg,
                rgba(255,140,140,0.5) 0%,
                rgba(240,130,130,0.38) 100%
            );
            border-color: rgba(255,160,160,0.45);
            box-shadow: 0 6px 24px rgba(255,130,130,0.25),
                        0 0 0 1px rgba(255,180,180,0.08),
                        var(--glass-highlight);
        }

        /* Loading state */
        #cloud-ui-root .btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        #cloud-ui-root .btn.loading .btn-text {
            opacity: 0;
        }

        #cloud-ui-root .btn-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: rgba(255, 255, 255, 0.9);
            border-right-color: rgba(180,180,255,0.7);
            border-radius: 50%;
            animation: glassSpin 0.75s linear infinite;
            display: none;
        }

        #cloud-ui-root .btn.loading .btn-loader {
            display: block;
        }

        @keyframes glassSpin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* -----------------------------------------------
           Badge - Glass chip
           ----------------------------------------------- */
        #cloud-ui-root .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            font-size: 11.5px;
            font-weight: 540;
            color: rgba(255, 255, 255, 0.93);
            background: rgba(180,170,255,0.18);
            border: 1px solid rgba(180,170,255,0.22);
            backdrop-filter: var(--glass-blur-light);
            -webkit-backdrop-filter: var(--glass-blur-light);
            box-shadow: var(--glass-highlight);
            letter-spacing: 0.1px;
        }

        /* -----------------------------------------------
           Modal Backdrop - Deep glass frost
           ----------------------------------------------- */
        #cloud-ui-root .modal-backdrop {
            position: absolute;
            inset: 0;
            display: none;
            place-items: center;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: saturate(150%) blur(8px);
            -webkit-backdrop-filter: saturate(150%) blur(8px);
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            perspective: 1200px;
        }

        #cloud-ui-root .modal-backdrop.open {
            display: grid;
            opacity: 1;
        }

        #cloud-ui-root .modal-backdrop.closing {
            opacity: 0;
            pointer-events: none;
        }

        /* -----------------------------------------------
           Modal Panel - Liquid Glass Canvas
           ----------------------------------------------- */
        #cloud-ui-root .modal {
            position: relative;
            width: min(480px, calc(100vw - 32px));
            max-height: calc(100vh - 40px);
            border-radius: var(--radius-xl);
            padding: 30px 28px;
            color: rgba(255, 255, 255, 0.93);
            border: 1px solid rgba(255, 255, 255, 0.16);
            /* Multi-layer glass background */
            background:
                linear-gradient(
                    170deg,
                    rgba(255,255,255,0.09) 0%,
                    rgba(255,255,255,0.04) 30%,
                    rgba(200,195,240,0.03) 60%,
                    rgba(255,255,255,0.05) 100%
                );
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            /* Depth shadow layers */
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.08),
                var(--depth-far),
                var(--glass-highlight),
                inset 0 0 120px rgba(140,130,255,0.03);
            transform: scale(0.9) translateY(30px) translateZ(0);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.22, 1, 0.18, 1);
            overflow-y: auto;
            overflow-x: hidden;
            will-change: transform, opacity;
        }

        /* Modal variants - subtle tint differences */
        #cloud-ui-root .modal-auth {
            width: min(420px, calc(100vw - 32px));
            background:
                linear-gradient(
                    170deg,
                    rgba(255,255,255,0.08) 0%,
                    rgba(210,200,250,0.05) 35%,
                    rgba(200,210,255,0.04) 65%,
                    rgba(255,255,255,0.05) 100%
                );
            box-shadow:
                0 0 0 1px rgba(180,200,255,0.09),
                var(--depth-far),
                var(--glass-highlight),
                0 0 80px rgba(155,155,255,0.06);
        }

        #cloud-ui-root .modal-history {
            width: min(520px, calc(100vw - 32px));
            background:
                linear-gradient(
                    170deg,
                    rgba(255,255,255,0.08) 0%,
                    rgba(220,200,255,0.05) 30%,
                    rgba(210,200,250,0.04) 60%,
                    rgba(255,255,255,0.05) 100%
                );
            box-shadow:
                0 0 0 1px rgba(180,180,255,0.09),
                var(--depth-far),
                var(--glass-highlight);
        }

        #cloud-ui-root .modal-leaderboard {
            border-color: rgba(230,210,160,0.18);
            background:
                linear-gradient(
                    170deg,
                    rgba(255,255,255,0.07) 0%,
                    rgba(240,220,180,0.04) 35%,
                    rgba(230,210,190,0.03) 65%,
                    rgba(255,255,255,0.04) 100%
                );
            box-shadow:
                0 0 0 1px rgba(230,210,160,0.08),
                var(--depth-far),
                var(--glass-highlight);
        }

        /* -----------------------------------------------
           Light Sweep - Animated beam across glass
           ----------------------------------------------- */
        #cloud-ui-root .modal::before {
            content: '';
            position: absolute;
            top: -60%;
            left: -60%;
            width: 220%;
            height: 220%;
            background: radial-gradient(
                ellipse at 50% 25%,
                rgba(255,255,255,0.09) 0%,
                rgba(220,210,255,0.04) 30%,
                transparent 60%
            );
            pointer-events: none;
            animation: lightSweep 10s ease-in-out infinite;
        }

        @keyframes lightSweep {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(2%, -2%) rotate(2deg); }
            50% { transform: translate(-2%, 2%) rotate(-2deg); }
            75% { transform: translate(2%, 2%) rotate(1deg); }
        }

        /* -----------------------------------------------
           Modal open/close animations
           ----------------------------------------------- */
        #cloud-ui-root .modal-backdrop.open .modal {
            transform: scale(1) translateY(0) translateZ(0);
            opacity: 1;
            animation: modalSettle 0.6s cubic-bezier(0.22, 1, 0.18, 1) forwards;
        }

        @keyframes modalSettle {
            0% { transform: scale(0.92) translateY(15px); }
            55% { transform: scale(1.008) translateY(-2px); }
            100% { transform: scale(1) translateY(0); }
        }

        #cloud-ui-root .modal-backdrop.closing .modal {
            transform: scale(0.94) translateY(12px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.55, 1);
        }

        /* -----------------------------------------------
           Modal Titles - Gradient Text
           ----------------------------------------------- */
        #cloud-ui-root .modal h2 {
            margin: 0;
            font-size: 23px;
            font-weight: 670;
            letter-spacing: -0.35px;
            background: linear-gradient(
                160deg,
                #FFFFFF 0%,
                #D8D8FF 45%,
                #C0C0F0 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* -----------------------------------------------
           Layout Helpers
           ----------------------------------------------- */
        #cloud-ui-root .row {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }

        #cloud-ui-root .row.title-row {
            margin-bottom: 6px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        /* -----------------------------------------------
           Auth Head
           ----------------------------------------------- */
        #cloud-ui-root .auth-head {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 16px;
            margin-bottom: 2px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* -----------------------------------------------
           Tabs - Glass pill segment control
           ----------------------------------------------- */
        #cloud-ui-root .tabs {
            display: inline-flex;
            gap: 3px;
            padding: 5px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: var(--glass-blur-light);
            -webkit-backdrop-filter: var(--glass-blur-light);
            box-shadow: var(--glass-highlight),
                        inset 0 1px 2px rgba(0,0,0,0.1);
        }

        #cloud-ui-root .tabs.tabs-auth {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 5px;
        }

        #cloud-ui-root .tabs.tabs-auth .tab {
            width: 100%;
            text-align: center;
            justify-content: center;
        }

        #cloud-ui-root .tab {
            position: relative;
            overflow: hidden;
            padding: 10px 20px;
            border-radius: var(--radius-full);
            background: transparent;
            color: rgba(255, 255, 255, 0.58);
            border: 1px solid transparent;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            cursor: pointer;
            z-index: 1;
        }

        #cloud-ui-root .tab:hover {
            color: rgba(255, 255, 255, 0.82);
            background: rgba(255, 255, 255, 0.06);
        }

        #cloud-ui-root .tab:active {
            transform: scale(0.96);
            transition: transform 0.08s ease;
        }

        #cloud-ui-root .tab.active {
            background: linear-gradient(
                135deg,
                rgba(155,150,240,0.45) 0%,
                rgba(170,155,240,0.35) 50%,
                rgba(180,170,255,0.25) 100%
            );
            color: rgba(255, 255, 255, 0.96);
            border-color: rgba(200,190,255,0.3);
            box-shadow: 0 4px 16px rgba(155,155,255,0.2),
                        var(--glass-highlight),
                        inset 0 1px 0 rgba(255,255,255,0.06);
        }

        /* -----------------------------------------------
           Form Fields
           ----------------------------------------------- */
        #cloud-ui-root .auth-fields {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        #cloud-ui-root .field {
            margin-top: 18px;
            display: grid;
            gap: 8px;
        }

        #cloud-ui-root .field.auth-stagger {
            animation: glassFieldIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) backwards;
            animation-delay: calc(var(--i, 0) * 55ms);
        }

        @keyframes glassFieldIn {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        #cloud-ui-root label {
            font-size: 13px;
            font-weight: 520;
            color: rgba(200, 200, 240, 0.8);
            margin-left: 4px;
            letter-spacing: 0.1px;
        }

        #cloud-ui-root input {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.93);
            outline: none;
            font-size: 14px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.08);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            font-family: inherit;
        }

        #cloud-ui-root input::placeholder {
            color: rgba(255, 255, 255, 0.32);
        }

        #cloud-ui-root input:hover {
            border-color: rgba(180, 180, 255, 0.35);
            background: rgba(255, 255, 255, 0.07);
        }

        #cloud-ui-root input:focus {
            border-color: rgba(180, 170, 255, 0.5);
            background: rgba(255, 255, 255, 0.09);
            box-shadow:
                0 0 0 5px rgba(155, 155, 255, 0.08),
                0 0 28px rgba(155, 155, 255, 0.1),
                inset 0 1px 2px rgba(0,0,0,0.08);
        }

        /* Auth-specific input focus */
        #cloud-ui-root .modal-auth input:focus {
            border-color: rgba(140, 210, 200, 0.45);
            box-shadow:
                0 0 0 5px rgba(126, 232, 208, 0.07),
                0 0 28px rgba(155, 155, 255, 0.08),
                inset 0 1px 2px rgba(0,0,0,0.08);
        }

        /* Optional field tag */
        #cloud-ui-root .optional-field label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #cloud-ui-root .optional-tag {
            font-size: 10.5px;
            font-weight: 560;
            padding: 2px 8px;
            border-radius: var(--radius-full);
