<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iBouncy - H</title>
    <style>
        * {
            user-select: none;
            -webkit-user-drag: none;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        canvas {
            position: fixed;
            width: 100vw;
            height: 100vh;
        }

        #loading {
            position: fixed;
            transform: translate(calc(50vw - 117px), calc(50vh - 50px)) scale(1.2);
        }

        /* ============================================
           Cloud UI (Auth/History) - Enhanced Design
           Theme Colors:
           - Primary: #5367FF (Bright Blue)
           - Secondary: #8B5CF6 (Purple)
           - Accent: #06D6A0 (Teal)
           - Background: Dark gradient
           ============================================ */
        #cloud-ui-root {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2000;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            user-select: text;
        }

        #cloud-ui-root * {
            user-select: text;
            -webkit-user-drag: none;
        }

        /* Floating Action Button */
        #cloud-ui-root .cloud-fab {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            pointer-events: auto;
        }

        #cloud-ui-root .pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 999px;
            color: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(83, 103, 255, 0.35);
            background: linear-gradient(135deg, rgba(83, 103, 255, 0.25), rgba(139, 92, 246, 0.15));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(83, 103, 255, 0.25), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: pillGlow 3s ease-in-out infinite;
        }

        @keyframes pillGlow {
            0%, 100% { box-shadow: 0 8px 32px rgba(83, 103, 255, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.1); }
            50% { box-shadow: 0 8px 32px rgba(83, 103, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15); }
        }

        #cloud-ui-root button {
            appearance: none;
            border: 0;
            cursor: pointer;
            font: inherit;
            position: relative;
            overflow: hidden;
        }

        /* Button Base Styles with Ripple Effect */
        #cloud-ui-root .btn {
            border-radius: 999px;
            padding: 10px 16px;
            color: rgba(255, 255, 255, 0.95);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.06));
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            font-size: 13px;
            letter-spacing: 0.3px;
        }

        #cloud-ui-root .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
        }

        #cloud-ui-root .btn:active::before {
            width: 200%;
            height: 200%;
        }

        #cloud-ui-root .btn:hover { 
            transform: translateY(-2px); 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.1));
            box-shadow: 0 4px 20px rgba(83, 103, 255, 0.3);
        }

        #cloud-ui-root .btn:active { 
            transform: translateY(0); 
            transition: transform 0.05s ease;
        }

        #cloud-ui-root .btn.primary { 
            background: linear-gradient(135deg, rgba(83, 103, 255, 0.85), rgba(139, 92, 246, 0.75)); 
            border-color: rgba(83, 103, 255, 0.5);
            box-shadow: 0 4px 20px rgba(83, 103, 255, 0.4);
        }

        #cloud-ui-root .btn.primary:hover { 
            background: linear-gradient(135deg, rgba(83, 103, 255, 0.95), rgba(139, 92, 246, 0.85)); 
            box-shadow: 0 6px 28px rgba(83, 103, 255, 0.55);
        }

        #cloud-ui-root .btn.danger { 
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.7), rgba(220, 38, 38, 0.6)); 
            border-color: rgba(239, 68, 68, 0.4);
        }

        #cloud-ui-root .btn.danger:hover {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.85), rgba(220, 38, 38, 0.75));
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.35);
        }

        /* Loading State for Buttons */
        #cloud-ui-root .btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        #cloud-ui-root .btn.loading .btn-text {
            opacity: 0;
        }

        #cloud-ui-root .btn-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        #cloud-ui-root .btn.loading .btn-loader {
            display: block;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        #cloud-ui-root .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.95);
            background: linear-gradient(135deg, rgba(83, 103, 255, 0.35), rgba(139, 92, 246, 0.25));
            border: 1px solid rgba(83, 103, 255, 0.3);
        }

        /* Modal Backdrop with Animation */
        #cloud-ui-root .modal-backdrop {
            position: absolute;
            inset: 0;
            display: none;
            place-items: center;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #cloud-ui-root .modal-backdrop.open { 
            display: grid; 
            opacity: 1;
        }

        #cloud-ui-root .modal-backdrop.closing {
            opacity: 0;
        }

        /* Enhanced Modal Design */
        #cloud-ui-root .modal {
            position: relative;
            width: min(480px, calc(100vw - 32px));
            max-height: calc(100vh - 40px);
            border-radius: 24px;
            padding: 28px;
            color: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(83, 103, 255, 0.35);
            background: linear-gradient(165deg, 
                rgba(30, 30, 50, 0.95) 0%, 
                rgba(22, 22, 38, 0.92) 50%,
                rgba(15, 15, 28, 0.9) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(83, 103, 255, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transform: scale(0.92) translateY(20px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow-y: auto;
        }

        #cloud-ui-root .modal-auth {
            width: min(420px, calc(100vw - 32px));
            border-color: rgba(83, 103, 255, 0.42);
            background: linear-gradient(168deg,
                rgba(32, 34, 58, 0.94) 0%,
                rgba(24, 26, 48, 0.9) 45%,
                rgba(14, 18, 36, 0.92) 100%);
            box-shadow:
                0 28px 90px rgba(0, 0, 0, 0.58),
                0 0 0 1px rgba(6, 214, 160, 0.12),
                0 0 48px rgba(83, 103, 255, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.09);
        }

        #cloud-ui-root .modal-history {
            width: min(520px, calc(100vw - 32px));
            border-color: rgba(139, 92, 246, 0.38);
            background: linear-gradient(168deg,
                rgba(34, 30, 56, 0.94) 0%,
                rgba(22, 24, 44, 0.91) 50%,
                rgba(16, 20, 40, 0.93) 100%);
            box-shadow:
                0 28px 90px rgba(0, 0, 0, 0.58),
                0 0 0 1px rgba(139, 92, 246, 0.14),
                0 0 40px rgba(6, 214, 160, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        #cloud-ui-root .auth-head {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 16px;
            margin-bottom: 4px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        #cloud-ui-root .tabs.tabs-auth {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 5px;
        }

        #cloud-ui-root .tabs.tabs-auth .tab {
            width: 100%;
            text-align: center;
            justify-content: center;
        }

        #cloud-ui-root .auth-fields {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        #cloud-ui-root .auth-actions {
            margin-top: 22px;
            padding-top: 4px;
            align-items: center;
        }

        #cloud-ui-root .auth-actions-right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        #cloud-ui-root .field.auth-stagger {
            animation: authFieldIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) backwards;
            animation-delay: calc(var(--i, 0) * 55ms);
        }

        @keyframes authFieldIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #cloud-ui-root .auth-hint {
            margin-top: 18px;
            background: linear-gradient(135deg, rgba(83, 103, 255, 0.1), rgba(6, 214, 160, 0.06));
            border-color: rgba(6, 214, 160, 0.22);
            color: rgba(196, 210, 254, 0.88);
        }

        #cloud-ui-root .optional-field label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #cloud-ui-root .optional-tag {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(6, 214, 160, 0.15);
            border: 1px solid rgba(6, 214, 160, 0.35);
            color: rgba(110, 231, 200, 0.95);
        }

        #cloud-ui-root .history-head {
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 14px;
        }

        #cloud-ui-root .history-title-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        #cloud-ui-root .history-title-accent {
            width: 48px;
            height: 3px;
            border-radius: 999px;
            background: linear-gradient(90deg, #5367FF, #06D6A0);
            opacity: 0.9;
        }

        #cloud-ui-root .history-actions {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
        }

        #cloud-ui-root .history-actions-right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        #cloud-ui-root .history-cards .card {
            background: linear-gradient(135deg, rgba(83, 103, 255, 0.14), rgba(6, 214, 160, 0.06));
            border-color: rgba(139, 92, 246, 0.22);
        }

        #cloud-ui-root .history-list .item {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.07), rgba(83, 103, 255, 0.04));
            border-color: rgba(255, 255, 255, 0.09);
        }

        #cloud-ui-root .modal-loading {
            position: absolute;
            inset: 0;
            z-index: 8;
            display: grid;
            place-items: center;
            border-radius: inherit;
            background: rgba(10, 12, 26, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.28s ease;
        }

        #cloud-ui-root .modal-loading.show {
            opacity: 1;
            pointer-events: auto;
        }

        #cloud-ui-root .modal-loading-spinner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.12);
            border-top-color: #06D6A0;
            border-right-color: #5367FF;
            animation: historySpin 0.75s linear infinite;
        }

        @keyframes historySpin {
            to { transform: rotate(360deg); }
        }

        #cloud-ui-root .modal-backdrop.open .modal {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        #cloud-ui-root .modal-backdrop.closing .modal {
            transform: scale(0.95) translateY(10px);
            opacity: 0;
        }

        #cloud-ui-root .modal h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #cloud-ui-root .row {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }

        #cloud-ui-root .row.title-row {
            margin-bottom: 8px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Enhanced Tabs */
        #cloud-ui-root .tabs {
            display: inline-flex;
            gap: 4px;
            padding: 5px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        #cloud-ui-root .tab {
            position: relative;
            overflow: hidden;
            padding: 10px 18px;
            border-radius: 999px;
            background: transparent;
            color: rgba(255, 255, 255, 0.65);
            border: 1px solid transparent;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.25s ease, background 0.25s ease, border-color 0.25s ease, transform 0.12s ease, box-shadow 0.25s ease;
            cursor: pointer;
        }

        #cloud-ui-root .tab:hover {
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.05);
        }

        #cloud-ui-root .tab:active {
            transform: scale(0.97);
        }

        #cloud-ui-root .tab.active {
            background: linear-gradient(135deg, rgba(83, 103, 255, 0.9), rgba(139, 92, 246, 0.8));
            color: rgba(255, 255, 255, 0.98);
            border-color: rgba(83, 103, 255, 0.4);
            box-shadow: 0 4px 15px rgba(83, 103, 255, 0.35);
        }

        /* Enhanced Form Fields */
        #cloud-ui-root .field {
            margin-top: 18px;
            display: grid;
            gap: 8px;
        }

        #cloud-ui-root label { 
            font-size: 13px; 
            font-weight: 500;
            color: rgba(165, 180, 252, 0.85);
            margin-left: 4px;
        }

        #cloud-ui-root input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.25);
            color: rgba(255, 255, 255, 0.95);
            outline: none;
            font-size: 14px;
            transition: all 0.25s ease;
        }

        #cloud-ui-root input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #cloud-ui-root input:hover {
            border-color: rgba(83, 103, 255, 0.4);
            background: rgba(0, 0, 0, 0.3);
        }

        #cloud-ui-root input:focus { 
            border-color: rgba(83, 103, 255, 0.7); 
            background: rgba(0, 0, 0, 0.35);
            box-shadow: 
                0 0 0 4px rgba(83, 103, 255, 0.15),
                0 0 20px rgba(83, 103, 255, 0.2);
        }

        #cloud-ui-root .modal-auth input:focus {
            border-color: rgba(6, 214, 160, 0.45);
            box-shadow:
                0 0 0 4px rgba(6, 214, 160, 0.12),
                0 0 22px rgba(83, 103, 255, 0.18);
        }

        #cloud-ui-root .hint {
            margin-top: 16px;
            padding: 14px 16px;
            font-size: 12px;
            color: rgba(165, 180, 252, 0.8);
            line-height: 1.6;
            background: rgba(83, 103, 255, 0.08);
            border-radius: 14px;
            border: 1px solid rgba(83, 103, 255, 0.15);
        }

        /* Enhanced Error Message */
        #cloud-ui-root .error {
            margin-top: 14px;
            font-size: 13px;
            font-weight: 500;
            color: rgba(254, 202, 202, 0.98);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.15));
            border: 1px solid rgba(239, 68, 68, 0.35);
            padding: 12px 14px;
            border-radius: 14px;
            display: none;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        #cloud-ui-root .error.show { display: block; }

        /* Enhanced List */
        #cloud-ui-root .list {
            margin-top: 16px;
            display: grid;
            gap: 10px;
            max-height: min(45vh, 360px);
            overflow: auto;
            padding-right: 6px;
        }

        #cloud-ui-root .list::-webkit-scrollbar {
            width: 6px;
        }

        #cloud-ui-root .list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        #cloud-ui-root .list::-webkit-scrollbar-thumb {
            background: rgba(83, 103, 255, 0.4);
            border-radius: 3px;
        }

        /* Enhanced Cards */
        #cloud-ui-root .cards {
            margin-top: 16px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        #cloud-ui-root .card {
            padding: 16px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(83, 103, 255, 0.12), rgba(139, 92, 246, 0.08));
            border: 1px solid rgba(83, 103, 255, 0.2);
            transition: all 0.25s ease;
        }

        #cloud-ui-root .card:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, rgba(83, 103, 255, 0.18), rgba(139, 92, 246, 0.12));
            box-shadow: 0 8px 25px rgba(83, 103, 255, 0.2);
        }

        #cloud-ui-root .card .k { 
            font-size: 11px; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(165, 180, 252, 0.75); 
        }

        #cloud-ui-root .card .v { 
            margin-top: 8px; 
            font-weight: 800; 
            font-size: 22px; 
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #cloud-ui-root .card.wide { 
            grid-column: 1 / -1; 
        }

        #cloud-ui-root .spark {
            width: 100%;
            height: 60px;
            margin-top: 12px;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        /* Enhanced List Items */
        #cloud-ui-root .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.03));
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        #cloud-ui-root .item:hover {
            background: linear-gradient(135deg, rgba(83, 103, 255, 0.1), rgba(139, 92, 246, 0.06));
            border-color: rgba(83, 103, 255, 0.25);
            transform: translateX(4px);
        }

        #cloud-ui-root .item .score { 
            font-weight: 800; 
            font-size: 18px;
            letter-spacing: -0.3px;
            color: rgba(255, 255, 255, 0.98);
        }

        #cloud-ui-root .item .time { 
            font-size: 12px; 
            color: rgba(165, 180, 252, 0.7);
            margin-top: 4px;
        }

        #cloud-ui-root .item .sync-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(6, 214, 160, 0.25), rgba(6, 214, 160, 0.15));
            color: rgba(6, 214, 160, 0.95);
            border: 1px solid rgba(6, 214, 160, 0.35);
        }

        /* Success Animation */
        #cloud-ui-root .success-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 14px 24px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(6, 214, 160, 0.95), rgba(5, 196, 144, 0.9));
            color: white;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 10px 40px rgba(6, 214, 160, 0.4);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 3000;
            pointer-events: none;
        }

        #cloud-ui-root .success-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Responsive Adjustments */
        @media (max-width: 480px) {
            #cloud-ui-root .modal {
                padding: 20px;
                border-radius: 20px;
            }
            
            #cloud-ui-root .cards {
                grid-template-columns: 1fr;
            }
            
            #cloud-ui-root .pill {
                flex-wrap: wrap;
                max-width: calc(100vw - 32px);
            }
        }
    </style>
</head>
<body>
<canvas></canvas>
<img id="loading" src="./src/assets/svg/loading.svg" alt="Loading..." draggable="false">
<div id="cloud-ui-root"></div>
<script defer type="module" src="src/app.ts"></script>
</body>
</html>
